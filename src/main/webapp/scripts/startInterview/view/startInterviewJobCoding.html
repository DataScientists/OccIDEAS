<div ng-cloak class="si-page">
  <div class="si-card si-card-wide">

    <div class="si-header-band">
      <img alt="OccIDEAS"
           class="si-logo"
           src="https://static.wixstatic.com/media/2ba4c3_72496cb786bf42f4bbcaa3687a4b9970.png"/>
    </div>

    <div class="si-body">

      <div class="si-field-group" ng-if="$storage.langEnabled">
        <label class="si-label">Language</label>
        <ui-select ng-change="changeNodeLanguage(selectLanguage)"
                   ng-model="selectLanguage.selected"
                   style="min-width: 150px;" theme="select2">
          <ui-select-match>
            <i class="glyphicon {{$select.selected.flag}}"></i> {{$select.selected.description}}
          </ui-select-match>
          <ui-select-choices repeat="lang in languages | propsFilter: {language: $select.search}">
            <i class="glyphicon {{lang.flag}}"></i>
            <div ng-bind-html="lang.description | highlight: $select.search" style="display: inline"></div>
          </ui-select-choices>
        </ui-select>
      </div>

      <div class="si-field-group">
        <label class="si-label" for="jobTitle">Job Title</label>
        <input class="si-input"
               id="jobTitle"
               ng-model="jobTitle"
               placeholder="e.g. Carpenter"
               required
               type="text"/>
      </div>

      <div class="si-field-group">
        <label class="si-label" for="jobDescription">What did you do at work?</label>
        <textarea class="si-input si-textarea"
                  id="jobDescription"
                  ng-model="jobDescription"
                  placeholder="Describe your main tasks and duties"
                  rows="4"></textarea>
      </div>

      <button class="si-btn-start"
              ng-click="findAnzscoCode()"
              ng-disabled="isLooking">
        {{isLooking ? 'Looking up...' : 'Find ANZSCO Code'}}
      </button>

      <div class="si-anzsco-results" ng-if="suggestions && suggestions.length > 0">
        <label class="si-label">Select the closest match</label>
        <div class="si-anzsco-option"
             ng-class="{'si-anzsco-option-selected': selectedSuggestion === suggestion}"
             ng-click="selectSuggestion(suggestion)"
             ng-repeat="suggestion in suggestions">
          <span class="si-anzsco-code">{{suggestion.code}}</span>
          <span class="si-anzsco-label">{{suggestion.label}}</span>
          <span class="si-anzsco-confidence">{{(suggestion.confidence * 100) | number:0}}%</span>
        </div>
      </div>

      <div ng-if="selectedSuggestion">
        <div class="si-anzsco-disambiguation"
             ng-if="!selectedSuggestion.moduleName && selectedSuggestion.disambiguationOptions.length > 0">
          <label class="si-label">{{selectedSuggestion.disambiguationQuestion}}</label>
          <div class="si-anzsco-option"
               ng-repeat="option in selectedSuggestion.disambiguationOptions"
               ng-click="selectDisambiguationOption(option)">
            <span class="si-anzsco-label">{{option.label}}</span>
          </div>
        </div>

        <div class="si-anzsco-module" ng-if="selectedSuggestion.moduleName">
          Matched interview: {{selectedSuggestion.moduleName}}
        </div>
        <div class="si-anzsco-module si-anzsco-module-warning"
             ng-if="!selectedSuggestion.moduleName && !(selectedSuggestion.disambiguationOptions.length > 0)">
          No specific interview module found for this occupation &mdash; the general interview will be used.
        </div>

        <div class="si-anzsco-actions"
             ng-if="selectedSuggestion.moduleName || !(selectedSuggestion.disambiguationOptions.length > 0)">
          <button class="si-btn-back" ng-click="goBack()">Back</button>
          <button class="si-btn-start" ng-click="continueToInterview()">Continue</button>
        </div>
      </div>

    </div>
  </div>
</div>
